name: Azure ML CTR Training

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "environments/**"
      - "pipelines/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: deploy-only (défaut) | retrain (réentraîner)"
        type: choice
        options:
          - deploy-only
          - retrain
        default: deploy-only
      model_version:
        description: "Version du modèle à déployer (deploy-only uniquement)"
        type: string
        default: "1"

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Azure ML SDK
        run: pip install azure-ai-ml azure-identity pyyaml

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Remplacer config.yml avec les secrets
        run: |
          python - <<'PYEOF'
          import yaml
          import os
          cfg = {
              "subscription_id": os.environ["AML_SUBSCRIPTION_ID"],
              "resource_group": os.environ["AML_RESOURCE_GROUP"],
              "workspace_name": os.environ["AML_WORKSPACE_NAME"],
              "compute_cluster": os.environ["AML_COMPUTE_CLUSTER"],
              "data_asset": os.environ["AML_DATA_ASSET"],
          }
          with open("config.yml", "w") as f:
              yaml.dump(cfg, f)
          print("config.yml written:", cfg)
          PYEOF
        env:
          AML_SUBSCRIPTION_ID: ${{ secrets.AML_SUBSCRIPTION_ID }}
          AML_RESOURCE_GROUP: ${{ secrets.AML_RESOURCE_GROUP }}
          AML_WORKSPACE_NAME: ${{ secrets.AML_WORKSPACE_NAME }}
          AML_COMPUTE_CLUSTER: ${{ secrets.AML_COMPUTE_CLUSTER }}
          AML_DATA_ASSET: ${{ secrets.AML_DATA_ASSET }}

      - name: Soumettre le job Azure ML
        run: |
          MODE="${{ github.event.inputs.mode }}"
          MODEL_VERSION="${{ github.event.inputs.model_version }}"
          # Par défaut (push) ou mode deploy-only: déployer sans réentraîner
          if [ "$MODE" == "retrain" ]; then
            python pipelines/training_pipeline.py --deploy --experiment "ctr-multimodal-ci"
          else
            VERSION=${MODEL_VERSION:-1}
            python pipelines/training_pipeline.py --deploy-only --model-version "$VERSION" --experiment "ctr-multimodal-ci"
          fi
