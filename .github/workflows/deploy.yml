name: Azure ML CTR Training

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "environments/**"
      - "pipelines/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Déployer l'endpoint après entraînement"
        type: boolean
        default: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Azure ML SDK
        run: pip install azure-ai-ml azure-identity pyyaml

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Remplacer config.yml avec les secrets
        run: |
          python - <<'PYEOF'
          import yaml
          import os
          cfg = {
              "subscription_id": os.environ["AML_SUBSCRIPTION_ID"],
              "resource_group": os.environ["AML_RESOURCE_GROUP"],
              "workspace_name": os.environ["AML_WORKSPACE_NAME"],
              "compute_cluster": os.environ["AML_COMPUTE_CLUSTER"],
              "data_asset": os.environ["AML_DATA_ASSET"],
          }
          with open("config.yml", "w") as f:
              yaml.dump(cfg, f)
          print("config.yml written:", cfg)
          PYEOF
        env:
          AML_SUBSCRIPTION_ID: ${{ secrets.AML_SUBSCRIPTION_ID }}
          AML_RESOURCE_GROUP: ${{ secrets.AML_RESOURCE_GROUP }}
          AML_WORKSPACE_NAME: ${{ secrets.AML_WORKSPACE_NAME }}
          AML_COMPUTE_CLUSTER: ${{ secrets.AML_COMPUTE_CLUSTER }}
          AML_DATA_ASSET: ${{ secrets.AML_DATA_ASSET }}

      - name: Soumettre le job d'entraînement Azure ML
        run: |
          DEPLOY_FLAG=""
          if [ "${{ github.event.inputs.deploy }}" == "true" ]; then
            DEPLOY_FLAG="--deploy"
          fi
          python pipelines/training_pipeline.py $DEPLOY_FLAG --experiment "ctr-multimodal-ci"
