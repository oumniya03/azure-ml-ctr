name: ctr-env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip:
    - torch==2.0.1
    - torchvision
    - transformers==4.35.0
    - pandas
    - numpy<2
    - scikit-learn
    - tqdm
    - Pillow
    - mlflow
    - azureml-mlflow
    - azure-ai-ml
    - pyarrow
    - fastapi
    - uvicorn
